# ============================================================
# niri4win 配置
# ============================================================

# ---- 窗口过滤 ----
# 按窗口类名过滤（不管理的窗口）
[class]
Windows.UI.Core.CoreWindow
ApplicationFrameWindow
Windows.Internal.Shell.TabProxyWindow
TaskManagerWindow

# 按窗口标题过滤
[title]
Game Bar
录制工具栏
任务管理器
设置

# 按进程路径过滤
[path]

# ---- 快捷键绑定 ----
# 格式: 修饰键+按键 = 动作
# 修饰键: Alt, Ctrl, Shift, Win (多个用 + 连接)
# 按键: A~Z, 0~9, Left, Right, Up, Down, =(或Equals), -(或Minus)
[hotkey]
# 窗口管理
Alt+Q = close_window
Shift+Alt+Q = quit

# 聚焦切换
Alt+Left = focus_left
Alt+Right = focus_right

# 窗口移动
Alt+Shift+Left = move_left
Alt+Shift+Right = move_right

# 宽度调节
Alt+= = increase_width
Alt+- = decrease_width

# 全屏切换
Alt+F = toggle_fullscreen

# 工作区切换
Alt+Up = workspace_up
Alt+Down = workspace_down

# 窗口移到相邻工作区
Alt+Shift+Up = move_workspace_up
Alt+Shift+Down = move_workspace_down

# 切换到指定工作区 1~9
Alt+1 = switch_workspace_1
Alt+2 = switch_workspace_2
Alt+3 = switch_workspace_3
Alt+4 = switch_workspace_4
Alt+5 = switch_workspace_5
Alt+6 = switch_workspace_6
Alt+7 = switch_workspace_7
Alt+8 = switch_workspace_8
Alt+9 = switch_workspace_9

# 窗口移到指定工作区 1~9
Alt+Shift+1 = move_to_workspace_1
Alt+Shift+2 = move_to_workspace_2
Alt+Shift+3 = move_to_workspace_3
Alt+Shift+4 = move_to_workspace_4
Alt+Shift+5 = move_to_workspace_5
Alt+Shift+6 = move_to_workspace_6
Alt+Shift+7 = move_to_workspace_7
Alt+Shift+8 = move_to_workspace_8
Alt+Shift+9 = move_to_workspace_9

# 按索引聚焦当前工作区窗口 1~9
Ctrl+1 = focus_column_1
Ctrl+2 = focus_column_2
Ctrl+3 = focus_column_3
Ctrl+4 = focus_column_4
Ctrl+5 = focus_column_5
Ctrl+6 = focus_column_6
Ctrl+7 = focus_column_7
Ctrl+8 = focus_column_8
Ctrl+9 = focus_column_9
